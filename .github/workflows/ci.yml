name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build IPA
        run: make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChickenLedger-ipa
          path: packages/*.ipa
