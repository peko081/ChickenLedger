name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos and ldid
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          brew install ldid
      - name: Build IPA
        run: make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa
      - name: Ensure standard IPA bundle metadata
        shell: bash
        run: |
          IPA_PATH=$(find "$GITHUB_WORKSPACE/packages" -name '*.ipa' -type f | head -n 1)
          STAGE="$RUNNER_TEMP/chicken-ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          unzip -q "$IPA_PATH" -d "$STAGE"
          APP_PATH=$(find "$STAGE/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)
          cp "$GITHUB_WORKSPACE/Info.plist" "$APP_PATH/Info.plist"
          printf 'APPL????' > "$APP_PATH/PkgInfo"
          rm "$IPA_PATH"
          (cd "$STAGE" && zip -qry "$IPA_PATH" Payload)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChickenLedger-ipa
          path: packages/*.ipa
